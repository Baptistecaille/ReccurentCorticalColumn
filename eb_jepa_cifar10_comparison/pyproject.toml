[project]
name = "eb-jepa-cifar10-comparison"
version = "0.1.0"
description = "CIFAR-10 comparison of the EB-JEPA MLP projector and a fixed cortical tree head"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = "==3.12.*"
dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "omegaconf>=2.3.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "fvcore>=0.1.5.post20221221",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab",
    "ipykernel",
    "matplotlib>=3.9",
    "pandas>=2.2",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["comparison*"]
